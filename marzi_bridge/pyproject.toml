[project]
name = "marzi_bridge"
authors = [
    { name = "Admin", email = "prabhas@marzi.life" },
]
description = "Frappe bridge to the Backend-for-org (marzi) APIs — server-side proxy for Track-1 admin features."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
